name: Release

on:
  push:
    tags: ["v*"]
  # Allows the Cut Release workflow (or a maintainer) to dispatch a release
  # run on an existing tag ref.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun install --frozen-lockfile
        working-directory: server
      - name: Verify release metadata
        shell: bash
        run: |
          package_version="$(bun -e 'console.log(require("./package.json").version)')"
          web_version="$(bun -e 'console.log(require("./web/package.json").version)')"
          server_version="$(bun -e 'console.log(require("./server/package.json").version)')"

          test "$GITHUB_REF_NAME" = "v$package_version"
          test "$web_version" = "$package_version"
          test "$server_version" = "$package_version"
          grep -Eq "^## ${package_version}( |$)" CHANGELOG.md
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: bun run precommit

  package:
    name: Package ${{ matrix.platform }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-x64
          - linux-arm64
          - darwin-x64
          - darwin-arm64
          - windows-x64
          - windows-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun install --frozen-lockfile
        working-directory: server
      - name: Build release package
        run: bun run package:${{ matrix.platform }}
      - name: Verify release package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          platform="${{ matrix.platform }}"
          package_dir="herdr-gui-$platform"
          versioned_archive="herdr-gui-v$version-$platform.tar.xz"
          latest_archive="herdr-gui-$platform.tar.xz"

          for archive in "$versioned_archive" "$latest_archive"; do
            test -f "dist/$archive"
            test -f "dist/$archive.sha256"
            if command -v sha256sum >/dev/null 2>&1; then
              (cd dist && sha256sum -c "$archive.sha256")
            else
              (cd dist && shasum -a 256 -c "$archive.sha256")
            fi
          done

          manifest="dist/herdr-gui-$platform.update.json"
          test -f "$manifest"
          if command -v sha256sum >/dev/null 2>&1; then
            archive_digest="$(sha256sum "dist/$latest_archive" | awk '{ print $1 }')"
          else
            archive_digest="$(shasum -a 256 "dist/$latest_archive" | awk '{ print $1 }')"
          fi
          expected_manifest="{\"schema\":1,\"name\":\"herdr-gui\",\"version\":\"$version\",\"platform\":\"$platform\",\"archive\":\"$latest_archive\",\"sha256\":\"$archive_digest\"}"
          grep -Fx "$expected_manifest" "$manifest"

          extract_dir="$RUNNER_TEMP/herdr-gui-release"
          mkdir -p "$extract_dir"
          tar -xJf "dist/$versioned_archive" -C "$extract_dir"
          grep -Fx "herdr-gui $version $platform" "$extract_dir/$package_dir/VERSION"
          binary_name="herdr-gui"
          case "$platform" in
            windows-*) binary_name="herdr-gui.exe" ;;
          esac
          binary="$extract_dir/$package_dir/$binary_name"
          case "$platform" in
            linux-x64)
              test "$("$binary" --version)" = "herdr-gui $version"
              ;;
            linux-arm64)
              file "$binary" | grep -Eq 'ELF 64-bit.*ARM aarch64'
              ;;
            darwin-x64)
              file "$binary" | grep -Eq 'Mach-O 64-bit.*x86_64'
              ;;
            darwin-arm64)
              file "$binary" | grep -Eq 'Mach-O 64-bit.*arm64'
              ;;
            windows-x64)
              file "$binary" | grep -Eq 'PE32\+ executable.*x86-64.*MS Windows'
              ;;
            windows-arm64)
              file "$binary" | grep -Eq 'PE32\+ executable.*Aarch64.*MS Windows'
              ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: herdr-gui-${{ matrix.platform }}
          path: |
            dist/*.tar.xz*
            dist/*.update.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Extract release notes from the changelog
        run: >-
          bun scripts/changelog-notes.ts "${GITHUB_REF_NAME#v}"
          > release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*
          scripts/install-herdr-gui.sh
          --verify-tag
          --latest
          --notes-file release-notes.md
          --title "herdr-gui $GITHUB_REF_NAME"
